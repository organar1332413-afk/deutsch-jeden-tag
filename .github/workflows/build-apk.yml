name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Android project
        run: |
          rm -rf extracted
          mkdir extracted

          if [ -f "settings.gradle" ]; then
            echo "Using project from repository root"
            echo "PROJECT_DIR=." >> $GITHUB_ENV
            exit 0
          fi

          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP_FILE" ]; then
            echo "No Android project ZIP found"
            exit 1
          fi

          echo "Using newest project archive: $ZIP_FILE"
          if unzip -t "$ZIP_FILE" >/dev/null 2>&1; then
            echo "Archive is a normal ZIP"
            PROJECT_ZIP="$ZIP_FILE"
          else
            echo "Archive is base64 text; decoding before unzip"
            base64 -d "$ZIP_FILE" > project.zip
            PROJECT_ZIP="project.zip"
          fi

          unzip -q "$PROJECT_ZIP" -d extracted

          PROJECT_DIR=$(find extracted -name settings.gradle -type f -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project was not found"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deutsch-jeden-tag-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
